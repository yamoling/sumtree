[package]
name = "sumtree"
version = "0.3.0"
edition = "2024"
repository = "https://github.com/yamoling/sumtree"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib", "rlib"]
name = "sumtree"
path = "src/lib.rs"

[dependencies]
pyo3 = { version = "0.29", features = ["generate-import-lib"] }
pyo3-stub-gen = "0.23"
rand = "0.10"
